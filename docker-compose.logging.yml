# docker-compose.logging.yml
# =============================================================================
# Logging / monitoring overlay — Grafana Loki stack
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.logging.yml up -d
#
# Then open Grafana at http://localhost:3000  (admin / ${GF_ADMIN_PASSWORD})
# =============================================================================

services:
  # --------------------------------------------------------------------------
  # Override backend to enable JSON stdout logging + Docker JSON-file driver
  # --------------------------------------------------------------------------
  backend:
    environment:
      LOG_CHANNEL: stack
      LOG_STACK: stdout,daily
      LOG_LEVEL: debug
      APP_VERSION: "0.0.1"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "{{.Name}}"

  # --------------------------------------------------------------------------
  # Loki — log aggregation engine (stores + indexes logs)
  # --------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.4.2
    container_name: tshirtslab-loki
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./docker/logging/loki.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --output-document=- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # --------------------------------------------------------------------------
  # Promtail — log collector (reads Docker stdout, ships to Loki)
  # --------------------------------------------------------------------------
  promtail:
    image: grafana/promtail:3.4.2
    container_name: tshirtslab-promtail
    volumes:
      - ./docker/logging/promtail.yaml:/etc/promtail/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - app-network

  # --------------------------------------------------------------------------
  # Grafana — visualization / dashboards
  # --------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.5.2
    container_name: tshirtslab-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_EXPLORE_ENABLED: "true"
    volumes:
      - ./docker/logging/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ./docker/logging/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml:ro
      - ./docker/logging/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      loki:
        condition: service_healthy
    networks:
      - app-network

volumes:
  loki_data:
  promtail_positions:
  grafana_data:
