server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------------------------------------------------------------------------
  # Docker container logs for infrastructure services that stay in Docker.
  # ---------------------------------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          # Only scrape containers that belong to this project
          - name: label
            values: ["com.docker.compose.project=tshirtslab"]

    relabel_configs:
      # Use container name as the "container" label
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: container

      # Use compose service name as "service" label
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service

      # Set a fixed job label for Loki queries
      - target_label: job
        replacement: tshirtslab-infra

      # Drop the logging stack itself to avoid recursive ingestion
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        action: drop
        regex: "loki|promtail|grafana"

    pipeline_stages:
      - docker: {}

  # ---------------------------------------------------------------------------
  # Native Laravel backend logs.
  # The backend runs on the host, but still writes structured JSON files to
  # storage/logs/ while Loki/Promtail remain containerized.
  # ---------------------------------------------------------------------------
  - job_name: backend-files
    static_configs:
      - targets:
          - localhost
        labels:
          job: tshirtslab
          service: backend
          container: native-backend
          __path__: /var/log/tshirtslab/backend/*.log

    pipeline_stages:
      - json:
          expressions:
            _msg: message
            level: level_name
            channel: channel
            environment: extra.environment
            app: extra.app
            pod: extra.pod
            uri: extra.uri

      - labels:
          level:
          channel:
          environment:
          app:
          pod:

      - timestamp:
          source: datetime
          format: "2006-01-02T15:04:05.000000Z07:00"
          fallback_formats:
            - "2006-01-02T15:04:05Z07:00"

      - drop:
          source: uri
          expression: "^/api/health$"
